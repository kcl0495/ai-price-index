name: daily collect and publish

# The whole operation. Runs itself, commits the day's data back to the repo so
# the time series accumulates, and republishes the site. No human in the loop.
on:
  schedule:
    # 06:10 UTC daily. Deliberately not on the hour: GitHub delays cron jobs
    # that land on popular minutes, and a delayed run risks missing a day.
    - cron: "10 6 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # to commit the new snapshot
  pages: write              # to publish
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install certifi
        run: python -m pip install --quiet certifi

      - name: Collect today's prices
        run: python engine/collect.py

      - name: Build site
        run: python engine/build_site.py

      - name: Commit the day's data
        run: |
          git config user.name  "price-index-bot"
          git config user.email "actions@github.com"
          git add data/
          # Nothing to commit is a normal outcome (a re-run on the same day),
          # not a failure -- so don't fail the job on it.
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      # The build cannot know where it will be served from, so a canonical tag
      # that points at the wrong host or path looks perfectly consistent during
      # the build and is invisible until a search engine quietly refuses to
      # index the site. Checking against the deployed URL is the only way to
      # catch it, so it is checked here, every single day.
      - name: Verify the deployed site points at itself
        run: |
          set -euo pipefail
          BASE="${{ steps.deploy.outputs.page_url }}"
          BASE="${BASE%/}"
          echo "deployed at: $BASE/"

          # Pages sits behind a CDN with a 10-minute TTL, so a just-deployed
          # file can still be served stale for a few seconds. Give each fetch a
          # few tries before believing what it says.
          get() {
            for i in 1 2 3 4 5; do
              if out=$(curl -fsS --max-time 20 "$1"); then printf '%s' "$out"; return 0; fi
              sleep 5
            done
            return 1
          }
          canonical_of() {
            get "$1" | grep -o '<link rel="canonical" href="[^"]*"' | sed 's/.*href="//; s/"$//'
          }
          reachable() { for i in 1 2 3; do curl -fsS -o /dev/null --max-time 20 "$1" && return 0; sleep 5; done; return 1; }

          canon=$(canonical_of "$BASE/")
          echo "homepage canonical: $canon"
          if [ "$canon" != "$BASE/" ]; then
            echo "::error::canonical '$canon' does not match deployed URL '$BASE/'"
            exit 1
          fi

          # Strip only the leading "Sitemap:" key. Splitting on every colon
          # truncates the value at "https:" -- which is exactly how this check
          # first failed against a site that was perfectly fine.
          sm=$(get "$BASE/robots.txt" | sed -n 's/^[Ss]itemap:[[:space:]]*//p' | tr -d '\r')
          echo "robots.txt sitemap: $sm"
          case "$sm" in
            "$BASE"/*) ;;
            *) echo "::error::robots.txt sitemap '$sm' is not under '$BASE/'"; exit 1 ;;
          esac
          reachable "$sm" || { echo "::error::sitemap '$sm' is not reachable"; exit 1; }

          # Spot-check one deep page: its canonical must resolve too.
          page=$(get "$sm" | grep -o '<loc>[^<]*models/[^<]*</loc>' | head -1 | sed 's/<[^>]*>//g')
          if [ -n "$page" ]; then
            pc=$(canonical_of "$page")
            echo "model page canonical: $pc"
            reachable "$pc" || { echo "::error::model page canonical '$pc' is a dead URL"; exit 1; }
          fi

          echo "all deployed URLs are self-consistent"
